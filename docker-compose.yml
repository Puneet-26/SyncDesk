services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aicte_complaints.db
      - SECRET_KEY=aicte_sih_super_secret_production_ready_jwt_key_2026
    volumes:
      - aicte_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aicte_data:
